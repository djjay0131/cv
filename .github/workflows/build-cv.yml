name: build-cv

on:
  push:
    # Run on all branches so feature work validates the matrix build before
    # merging. The publish job is gated to master, so feature pushes test
    # but don't ship.
    branches-ignore: []
    paths-ignore:
      - "llm/**"
      - "**/*.md"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # needed to update the "latest" release.

jobs:
  tests:
    name: Python tests & lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint bibliography
        run: python -m tools.lint_bib own-bib.bib

      - name: Run test suite
        run: pytest

      - name: Ruff check
        run: ruff check .

  configure:
    name: Discover variants
    needs: tests
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          json=$(ls data/variants/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' | jq -R . | jq -sc .)
          echo "variants=$json" >> "$GITHUB_OUTPUT"
          echo "Variants: $json"

  build:
    name: Compile ${{ matrix.variant }}
    needs: configure
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true     # one variant fails -> halt the whole release.
      matrix:
        variant: ${{ fromJSON(needs.configure.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2 pydantic bibtexparser

      - name: Render LaTeX fragments
        run: python -m tools.render "${{ matrix.variant }}"

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv-llt.tex
          latexmk_use_xelatex: true
          args: "-interaction=nonstopmode -halt-on-error -usepretex=\\def\\cvvariant{${{ matrix.variant }}} -jobname=${{ matrix.variant }}"

      - name: Install pdftoppm + ImageMagick for visual regression
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Visual-regression diff against committed baseline
        run: |
          set -e
          v="${{ matrix.variant }}"
          tolerance="${VR_TOLERANCE:-0}"
          baseline_dir="tests/baselines/$v"
          if [ ! -d "$baseline_dir" ]; then
            echo "::warning::no baseline for $v at $baseline_dir -- skipping diff (commit a baseline to enable)"
            exit 0
          fi
          mkdir -p "dist/vr/$v"
          pdftoppm -r 150 "$v.pdf" "dist/vr/$v/page" -png
          fail=0
          for new_page in dist/vr/$v/page-*.png; do
            name=$(basename "$new_page")
            base="$baseline_dir/$name"
            if [ ! -f "$base" ]; then
              echo "::error::baseline missing: $base"
              fail=1
              continue
            fi
            diff_count=$(compare -metric AE "$base" "$new_page" "dist/vr/$v/diff-$name" 2>&1 || true)
            echo "$v $name: $diff_count pixels differ"
            if [ "$diff_count" -gt "$tolerance" ] 2>/dev/null; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::visual regression detected for $v -- see dist/vr/$v/diff-*.png"
            exit 1
          fi

      - name: Stage variant PDF
        run: |
          mkdir -p dist
          cp "${{ matrix.variant }}.pdf" "dist/${{ matrix.variant }}.pdf"

      - name: Upload per-variant artifact
        uses: actions/upload-artifact@v4
        with:
          name: variant-${{ matrix.variant }}
          path: |
            dist/${{ matrix.variant }}.pdf
            dist/vr/**
          retention-days: 30

  publish:
    name: Publish release + hub contract
    needs: build
    runs-on: ubuntu-24.04
    # Gated to master and to non-pull-request events, as the release already
    # was. A fork PR builds and diffs but can never publish. cv's Workload
    # Identity provider independently admits only refs/heads/master on this
    # repository id and refuses pull_request_target, so this gate is the
    # nearer of two locks, not the only one.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      # The "latest" GitHub release, exactly as before.
      contents: write
      # The OIDC token the hub's publish action exchanges through Workload
      # Identity Federation. It is the only credential in this job, it is
      # minted at run time, and it grants nothing but writes under
      # gs://<content-bucket>/sources/cv/.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all variant artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: variant-*
          merge-multiple: true

      # dist/ is what the hub publishes, so it holds only what the manifest
      # describes: the four variant PDFs, the cv-data payload and manifest.json.
      # cv-data.zip is staged under release/ instead, because it is a GitHub
      # release asset and not part of the published contract.
      - name: Stage the variant PDFs
        run: |
          mkdir -p dist
          find artifacts -name "*.pdf" -exec cp {} dist/ \;
          ls -la dist/

      - name: Stage the cv-data payload
        # Exactly the contents of cv-data.zip, unzipped. The hub reads these
        # files directly to render the CV pages, so the shape must not change
        # without a schema_version bump (website ADR-0008 decision 5).
        run: |
          set -euo pipefail
          mkdir -p dist/cv-data
          cp -R data dist/cv-data/data
          cp own-bib.bib photo_jason_1.jpeg dist/cv-data/
          find dist/cv-data -type f | sort

      - name: Pack cv-data.zip for the GitHub release
        # Built from the same staged payload, so the release asset and what the
        # hub reads can never drift.
        run: |
          set -euo pipefail
          mkdir -p release
          (cd dist/cv-data && zip -r "$GITHUB_WORKSPACE/release/cv-data.zip" \
            data own-bib.bib photo_jason_1.jpeg)
          unzip -l release/cv-data.zip

      - name: Generate the hub publishing manifest
        # dist/manifest.json, at the root of dist/. Generated from
        # data/variants/*.yaml — the same discovery the `configure` job uses —
        # so the manifest cannot drift from the matrix that built the PDFs.
        # A venv rather than actions/setup-python: this job needs two pure-Python
        # packages for one command, and adding a third-party action here would
        # be more moving parts than it saves.
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet pyyaml pydantic
          .venv/bin/python -m tools.manifest --dist dist
          cat dist/manifest.json

      - name: Upload combined workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-${{ github.sha }}
          path: |
            dist/*.pdf
            dist/manifest.json
            release/cv-data.zip
          retention-days: 30

      - name: Update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest CV build"
          body: "Automated build from ${{ github.sha }}."
          files: |
            dist/*.pdf
            release/cv-data.zip
          make_latest: "true"
          prerelease: false

      # Publish through the research hub's own composite action. It validates
      # manifest.json against the hub's schema, checks that every path stays
      # inside dist/, checks that the manifest's source matches the `source`
      # input, and only then exchanges this job's OIDC token for a short-lived
      # GCP credential and uploads dist/ to gs://<bucket>/sources/cv/.
      #
      # cv holds NO GitHub credential for the website repository and no
      # service-account key. The hub polls the bucket; it is not notified
      # (website ADR-0007). The four vars.* below are GitHub Actions variables,
      # not secrets — none of them is secret, and treating them as secrets only
      # makes failures harder to read. `dist` and `source` are literals.
      # See docs/satellites.md in the website repository.
      - name: Publish to the research hub
        uses: djjay0131/website/contract/publish@main
        with:
          dist: ./dist
          source: cv
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISH_SA }}
          bucket: ${{ vars.GCP_CONTENT_BUCKET }}
