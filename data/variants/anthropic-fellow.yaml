variant: anthropic-fellow
label: "Anthropic Fellow application"
description: "Researcher CV targeting the Anthropic Fellows Program: alignment, mech-interp, and secure-software depth."

theme:
  style: refined-serif
  photo: false

sections:
  - type: summary
    content_id: fellowship

  - type: employment
    include:
      - vt-doctoral-research
      - id: vt-gra-mrs
        bullets: [vt-gra-mrs-overview]
      - id: yoh-adf-architect
        bullets: [yoh-mvp, yoh-llm, yoh-api]
      - id: duck-creek-architect
        bullets: [dc-sev1, dc-pen-testing]
      - id: blackbaud-principal
        collapse: true
      - id: blackbaud-solutions
        collapse: true
      - id: djjaynet-consultant
        collapse: true
      - id: limeleap-chief-engineer
        collapse: true
      - id: limeleap-director-productivity
        collapse: true

  - type: education
    include:
      - phd-cs-vt
      - meng-cs-vt
      - mit-vt
      - bs-econ-vt

  - type: publications

  - type: projects
    include:
      - mrs-cloud-architecture
      - vttsi
      - agentic-kg
      - construction-ai
      - security-classifier

  - type: skills
    include:
      - ai-ml
      - id: languages
        items: [Python, C#, Java, JavaScript, Bash, PowerShell, T-SQL, "C++", Node.js]
      - id: tools
        items: [Azure, AWS, Docker, FastAPI, Streamlit, PostgreSQL, "SQL Server", VS Code, PyCharm, Wireshark]
      - platforms

  # Misc section (Awards + Certifications) dropped from this variant to
  # keep the resume at 2 pages. CSSLP survives via the summary line's
  # "CSSLP-certified" mention.
