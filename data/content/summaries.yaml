- id: academic
  text: >-
    Results-oriented technical executive and principal engineer with deep experience
    leading platform architecture, data integration, and SaaS operations.
    Specialized in Azure (Data Factory, Storage, Key Vault), large-scale ETL/ELT
    pipelines, automation, and end-to-end delivery. Proven record building teams,
    accelerating migrations, and embedding AI/ML to increase quality and speed of
    software delivery.

- id: research-professional
  text: >-
    Computer Science PhD candidate and applied researcher who bridges large-scale
    software engineering with empirical AI/ML research. Two decades architecting
    Azure data platforms and SaaS systems now grounds research that is reproducible,
    deployable, and measured against real workloads, spanning LLM-assisted software
    engineering, security classification, and mechanistic interpretability.
    Published at ICSE 2026, with hands-on depth in ML pipelines, evaluation design,
    and the engineering rigor that industry R&D depends on.

- id: agentic-principal
  text: >-
    Principal engineer and solution architect with **20+ years** delivering large,
    complex systems --- enterprise SaaS operations, Azure data platforms, and
    full-stack applications in C#, Java, Python, Node, and React --- who now designs
    development processes in which **AI generates the majority of implementation
    code under human validation**. Standardized on **Claude Code** after evaluating
    Cursor, Codex, and Copilot in practice, and built working systems on that
    workflow: a cloud-and-edge robotics platform, an LLM-driven insurance data
    importer, and agent-orchestrated knowledge graphs. PhD research at Virginia Tech
    on the empirical evaluation of GenAI coding tools (**ICSE 2026**; arXiv preprints)
    supplies the methodology behind the practice. CSSLP-certified; Certified Scrum
    Master.

- id: fellowship
  text: >-
    PhD candidate in Computer Science (SE with AI/ML/MI) at Virginia Tech, focused on
    the empirical methodology of evaluating LLM behavior and accumulating verifiable
    safety claims. Two papers on evidence-based reasoning in GenAI tools and knowledge
    accumulation in software engineering research (**ICSE 2026**; arXiv preprint).
    Background combines hands-on ML/LLM application work --- LLM-assisted code generation,
    ML-driven incident prediction, behavioral evals --- with **20+ years of secure-software
    delivery** (CSSLP-certified, recent mesh-VPN/2FA platform hardening at Virginia
    Tech's ARCADE Lab).
