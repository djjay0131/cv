- id: mrs-cloud-architecture
  name: "Multi Robot System --- Cloud + Edge Architecture (VT ARCADE Lab)"
  url: "https://arcade.mlsoc.vt.edu/"
  summary: >-
    Designed and built the cloud-and-edge architecture for the ARCADE Lab's
    Multi Robot System for remote construction-progress monitoring: Google
    Cloud (REST API + web apps), Tailscale mesh VPN for robot networking,
    Raspberry Pi edge nodes handling internal VPN routing and onboard video
    encoding, 2FA-hardened Web UI. Architecture completed and proven in a
    5-week GRA appointment; **Claude used as engineering partner throughout**.

- id: vttsi
  name: "VTTSI --- LLM-Adaptive Intersection Safety Scoring"
  summary: >-
    Distributed rewrite of a CS6604 traffic-safety application:
    provenance-tracked evidence ingestion (NWS weather, VDOT/511 cameras)
    → deterministic RT-SI + MCDM baselines → **Claude Opus** adaptive
    adjustment with grounding guardrails and deterministic fallback →
    honest-null ablation eval (Spearman / Pearson). Python
    ports-and-adapters microservices; live-Claude integration wired;
    ~97% offline coverage.

- id: agentic-kg
  name: "Agentic Knowledge Graphs for Research Progression"
  url: "https://djjay0131.github.io/agentic-kg/"
  summary: >-
    Orchestrated agent system (Navigator / Extractor / Continuation)
    building an **LLM-curated research KG** --- problems, assumptions,
    constraints, evidence spans, datasets, metrics --- as the provenance
    substrate for downstream research-assistant responses. Denario agent
    framework; Python / FastAPI; staging deployed on Cloud Run. Approaching
    experimental comparison against LLM-generated KGs.

- id: construction-ai
  name: "Construction-AI: LLM- and KG-backed Material Takeoff"
  url: "https://djjay0131.github.io/construction-ai-proposal/"
  summary: >-
    Web app parsing architectural drawings (DWG / DXF / PDF), extracting
    geometry via PyTorch / OpenCV / EasyOCR, producing JSON material
    takeoffs with OR-Tools cut-list optimization backed by a Neo4j
    **LLM-curated KG**. Phase 1 MVP deployed on Cloud Run; Phase 5 in
    progress adds a **VVUQ** (verification / validation / uncertainty
    quantification) layer for engineering-simulation reproducibility.

- id: vvuq-beam-solver
  name: "VVUQ of an Euler--Bernoulli Beam Finite-Difference Model"
  summary: >-
    Verification, Validation, and Predictive Uncertainty Quantification of
    a finite-difference beam solver for residential LVL header design
    (AOE/CS/ME 6444 final paper, Spring 2026; advisor Dr.\ Christopher Roy;
    coauthor Cheng-Shun Chuang). Planned extension into a reusable VVUQ
    framework.

- id: llm-coding-assistant
  name: "LLM Coding Assistant"
  summary: "Python, Streamlit, OpenAI API; FastAPI backend; agentmon design."

- id: security-classifier
  name: "Security Vulnerability Classifier"
  summary: >-
    ML classifier scanning code repositories against the
    CVE.org vulnerability corpus to flag patterns matching
    known vulnerability classes.

- id: sentiment-yelp
  name: "Sentiment Analysis of Yelp Reviews"
  summary: "Python, Pandas, NLTK; topic modeling with LDA."

- id: nfl-ml
  name: "Predicting NFL Player Performance"
  summary: "Time-series modeling using ML regressors."

