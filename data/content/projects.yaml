- id: agentic-kg
  name: "Agentic Knowledge Graphs for Research Progression"
  summary: >-
    Orchestrated agent system (Navigator / Extractor / Continuation) over a
    research KG modeling problems, assumptions, constraints, evidence spans,
    datasets, and metrics. Live API + UI on Google Cloud Run; Denario agent
    framework, Python / FastAPI.

- id: construction-ai
  name: "Construction-AI: LLM- and KG-backed Material Takeoff"
  summary: >-
    AI-powered web app that parses architectural drawings (DWG / DXF / PDF),
    extracts geometry, and produces JSON material takeoffs with cut-list
    optimization. Phase 1 MVP shipped (wall / stud / plate calculation,
    React UI, Docker); proposal extends to YOLOv8 object detection,
    LLM-driven interpretation, and OR-Tools optimization.

- id: vvuq-beam-solver
  name: "VVUQ of an Euler--Bernoulli Beam Finite-Difference Model"
  summary: >-
    Verification, Validation, and Predictive Uncertainty Quantification of
    a finite-difference beam solver for residential LVL header design
    (AOE/CS/ME 6444 final paper, Spring 2026; advisor Dr.\ Christopher Roy;
    coauthor Cheng-Shun Chuang). Planned extension into a reusable VVUQ
    framework.

- id: llm-coding-assistant
  name: "LLM Coding Assistant"
  summary: "Python, Streamlit, OpenAI API; FastAPI backend; agentmon design."

- id: security-classifier
  name: "Security Vulnerability Classifier"
  summary: "Repository scanner classifying code against CVE mappings."

- id: sentiment-yelp
  name: "Sentiment Analysis of Yelp Reviews"
  summary: "Python, Pandas, NLTK; topic modeling with LDA."

- id: nfl-ml
  name: "Predicting NFL Player Performance"
  summary: "Time-series modeling using ML regressors."

